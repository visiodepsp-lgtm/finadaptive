name: KARUBET - probabilidades originales 6.3

on:
  # Los lunes, después de la sincronización de BBETS (07:17 UTC).
  # También puede ejecutarse manualmente tras actualizar BBETS_2026.zip.
  schedule:
    - cron: '13 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: karubet-model-6-3
  cancel-in-progress: false

jobs:
  predictions:
    name: Refrescar fixture y calcular PA/Quasi/Doble/Remontada
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias del modelo original
        run: python -m pip install -r karubet/requirements-model.txt
      - name: Verificar sintaxis
        run: python -m py_compile karubet/import_bbets.py karubet/score_weekly.py
      - name: Probar PA, Quasi PA y Doble PA antes de guardar
        run: PYTHONPATH=karubet python -m unittest discover -s karubet -p 'test_score_*.py' -v
      - name: Importar resultados y fixtures nuevos
        run: python karubet/import_bbets.py --dataset BBETS_2026
      - name: Ejecutar KARUBET 6.3 sin reentrenar
        run: python karubet/score_weekly.py
      - name: Adjuntar reporte de probabilidades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karubet-predicciones-pa-6-3
          path: karubet/output/PA_Quasi_Doble_6_3.csv
          retention-days: 7
          if-no-files-found: ignore
