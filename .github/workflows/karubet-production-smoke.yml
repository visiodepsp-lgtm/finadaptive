name: KARUBET - validar web publicada

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/karubet-production-smoke.yml'
      - 'karubet/web/team-crests.js'
      - 'karubet/web/classic.html'
      - 'karubet/web/styles.css'
      - 'karubet/web/app.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirmar dos páginas independientes en Vercel sin iframe
        env:
          PUBLIC_URL: https://finadaptive-web.vercel.app
        run: |
          python - <<'PY'
          import os,time,urllib.request,urllib.error
          root=os.environ['PUBLIC_URL'].rstrip('/')
          last=''
          for attempt in range(24):
              try:
                  outputs={}
                  for path in ('/','/classic.html','/classic-app.js','/team-crests.js','/styles.css'):
                      with urllib.request.urlopen(urllib.request.Request(
                          root+path,headers={'User-Agent':'KARUBET-public-healthcheck/2.0'}
                      ),timeout=12) as res:
                          outputs[path]=(res.status,res.headers,res.read().decode('utf-8','replace'))
                  classic=outputs['/classic.html']
                  assets=outputs['/team-crests.js'][2]
                  styles=outputs['/styles.css'][2]
                  index=outputs['/']
                  script=outputs['/classic-app.js']
                  with urllib.request.urlopen(urllib.request.Request(
                      root+'/api/data?kind=fixtures&limit=10&days=14',
                      headers={'User-Agent':'KARUBET-public-healthcheck/3.0'}
                  ),timeout=20) as res:
                      api_status=res.status
                      api_data=__import__('json').loads(res.read().decode('utf-8'))
                  xfo=classic[1].get('X-Frame-Options','')
                  csp=classic[1].get('Content-Security-Policy','')
                  ok=(all(value[0]==200 for value in outputs.values()) and
                      xfo.upper()=='DENY' and "frame-ancestors 'none'" in csp and
                      '<iframe' not in index[2] and '<iframe' not in classic[2] and
                      'href="/?tab=market"' in classic[2] and
                      'loadClassicStandalone()' in script[2] and
                      'KARUBET' in classic[2] and
                      api_status==200 and isinstance(api_data.get('items'),list) and
                      '<script defer src="/team-crests.js"' in index[2] and
                      'marketSearch' in index[2] and
                      'marketLeaguePills' in index[2] and
                      'marketFreshness' in index[2] and
                      'KARUBET_LEAGUE_CREST' in assets and
                      'league_premier-league.png' in assets and
                      'league_serie-a.png' in assets and
                      'view-transition-name:karubet-header' in styles and
                      '10 MIN' in index[2])
                  if ok:
                      print('PUBLICACIÓN CORRECTA: logos de liga, 10min, transición compartida, salud de mercado y API pública.')
                      break
                  last=f"HTTP={[o[0] for o in outputs.values()]}; XFO={xfo}; independiente={ok}"
              except (urllib.error.URLError,TimeoutError) as err:
                  last=type(err).__name__
              time.sleep(6)
          else:
              raise SystemExit('Versión pública todavía no validada: '+last)
          PY

      - name: Confirmar endpoint público y bloqueo de POST sin clave
        env:
          PUBLIC_URL: https://finadaptive-web.vercel.app
        run: |
          python - <<'PY'
          import json,os,time,urllib.request,urllib.error
          url=os.environ['PUBLIC_URL'].rstrip('/')+'/api/capture'
          latest=''
          for attempt in range(25):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,method='GET'),timeout=15) as response:
                      data=json.load(response)
                      ready=data.get('ready')
                      if response.status!=200 or not ready:
                          raise RuntimeError('endpoint no configurado')
                  req=urllib.request.Request(url,method='POST',data=b'',headers={
                      'Origin':os.environ['PUBLIC_URL'],'User-Agent':'KARUBET-security-smoke'
                  })
                  try:
                      urllib.request.urlopen(req,timeout=15)
                      raise AssertionError('POST sin clave se acepto: FALLO DE SEGURIDAD')
                  except urllib.error.HTTPError as error:
                      body=error.read().decode('utf-8','replace')
                      if error.code!=401:
                          latest=f'POST sin clave HTTP {error.code}, body={body[:200]}'
                          raise RuntimeError(latest)
                      print('CAPTURA SEGURA: GET activo, POST sin clave bloqueado (HTTP 401).')
                      break
              except (urllib.error.URLError,TimeoutError,RuntimeError,ValueError) as error:
                  latest=type(error).__name__+': '+str(error)[:150]
                  if attempt in (0,10,20):
                      print('Verificando endpoint: '+latest)
                  time.sleep(6)
          else:
              raise SystemExit('Endpoint captura sin validar: '+latest)
          PY
