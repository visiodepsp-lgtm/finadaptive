name: KARUBET - validar web publicada

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/karubet-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirmar que Vercel permite el Match Centre sólo dentro de KARUBET
        env:
          PUBLIC_URL: https://finadaptive-web.vercel.app/classic.html
        run: |
          python - <<'PY'
          import os,time,urllib.request,urllib.error
          url=os.environ['PUBLIC_URL']
          last=""
          for attempt in range(18):
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'KARUBET-public-healthcheck/1.0'})
                  with urllib.request.urlopen(request,timeout=12) as res:
                      status=res.status
                      h=res.headers
                      xfo=h.get('X-Frame-Options','')
                      csp=h.get('Content-Security-Policy','')
                      body=res.read(2048).decode('utf-8','replace')
                      last=f"HTTP {status}, XFO {xfo}, CSP frame-ancestors-self={chr(39)+'self'+chr(39) in csp}"
                      if (status==200 and xfo.upper()=='SAMEORIGIN' and
                          "frame-ancestors 'self'" in csp and 'KARUBET' in body):
                          print('PUBLICACIÓN CORRECTA: classic.html HTTP 200, marco SAMEORIGIN y CSP self.')
                          break
              except (urllib.error.URLError,TimeoutError) as err:
                  last=type(err).__name__
              time.sleep(8)
          else:
              raise SystemExit('Publicación no validada: '+last+'. Revisar el proyecto Vercel y deploy actual.')
          PY
