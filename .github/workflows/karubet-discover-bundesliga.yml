name: KARUBET - descubrir categoria Bundesliga (solo lectura)
on:
  push:
    branches: [main]
    paths:
      - 'karubet/probe_bundesliga.py'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: karubet/requirements.txt
      - run: |
          python -m pip install -r karubet/requirements.txt
          python -m playwright install --with-deps chromium
      - run: python karubet/probe_bundesliga.py
