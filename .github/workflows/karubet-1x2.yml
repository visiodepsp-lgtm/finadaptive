name: KARUBET - cuotas 1X2 cada 30 min

on:
  # Cada 30 minutos, en UTC. Minutos desplazados del inicio de hora
  # para reducir demoras en los runners compartidos de GitHub.
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      save_to_db:
        description: "Guardar capturas en Supabase (solo tras revisar el diagnostico)"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: karubet-1x2-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Leer cuotas de 5 ligas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Las ejecuciones programadas guardan datos; las manuales son dry-run por defecto.
      PERSIST: ${{ github.event_name == 'schedule' || inputs.save_to_db }}
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install -r karubet/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Revisar sintaxis
        run: python -m py_compile karubet/*.py
      - name: Probar filtros del modelo de datos
        run: PYTHONPATH=karubet python -m unittest discover -s karubet -p 'test_*.py' -v
      - name: Capturar listado y verificar conexion
        shell: bash
        run: |
          if [ "$PERSIST" = "true" ]; then
            python karubet/collector.py --out karubet/output --persist
          else
            python karubet/collector.py --out karubet/output
          fi
      - name: Comparar cuotas con capturas previas y generar alertas
        if: ${{ env.PERSIST == 'true' }}
        run: python karubet/report_movements.py
      - name: Descargar diagnosticos y cuotas como artifact
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: karubet-diagnostico-1x2
          path: karubet/output/
          retention-days: 3
          if-no-files-found: warn
