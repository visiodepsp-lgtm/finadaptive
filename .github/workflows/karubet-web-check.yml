name: KARUBET - validar web 7.0
on:
  push:
    branches:
      - main
    paths:
      - 'karubet/web/**'
      - '.github/workflows/karubet-web-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar JavaScript, HTML y funciones Python
        run: |
          node --check karubet/web/app.js
          node karubet/web/tests/test_market_rules.mjs
          node --check karubet/web/classic-app.js
          node --check karubet/web/team-crests.js
          node --check karubet/web/original-logo.js
          node karubet/web/tests/test_classic_bridge.mjs
          python -m py_compile karubet/web/api/data.py
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              def __init__(self): super().__init__(); self.ids=set();self.dupes=[]
              def handle_starttag(self,tag,attrs):
                  for key,value in attrs:
                      if key=='id':
                          if value in self.ids:self.dupes.append(value)
                          self.ids.add(value)
          for html in ('index.html','classic.html'):
              p=Check();p.feed((Path('karubet/web')/html).read_text());assert not p.dupes,(html,p.dupes)
          print('HTML validado: IDs únicos en ambas hojas')
          PY
          python -c "import json; json.load(open('karubet/web/vercel.json',encoding='utf-8')); print('Vercel config OK')"
          python - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path('karubet/web/vercel.json').read_text())
          rules=[r for r in config['headers'] if r['source']=='/(.*)']
          assert len(rules)==1, 'No hay cabeceras seguras en Vercel'
          headers={h['key'].lower():h['value'] for h in rules[0]['headers']}
          assert headers['x-frame-options'].upper()=='DENY'
          assert "frame-ancestors 'none'" in headers['content-security-policy']
          assert "script-src 'self'" in headers['content-security-policy']
          html=Path('karubet/web/index.html').read_text()
          classic=Path('karubet/web/classic.html').read_text()
          assert '<iframe' not in html and '<iframe' not in classic
          assert 'href="/classic.html"' in html
          assert 'href="/?tab=market"' in classic
          assert 'data-karubet-logo="original"' in classic
          print('Páginas independientes sin iframes: OK')
          PY
      - name: Probar API offline sin secretos
        run: python -m unittest discover -s karubet/web/tests -p 'test_*.py' -v
